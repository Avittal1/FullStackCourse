<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="images.css">
    <title>images-gallery</title>
</head>
<body>
    <header class="navbar">
        <div class="nav-left">
            <a href="#" class="logo">
                <img src="ChatGPT-Logo.svg.webp" alt="ChatGPT Logo" class="logo-img">
                ChatGPT
            </a>
        </div>

        <nav class="nav-center">
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="images.html">Images</a></li>
                <li><a href="agent.html">Agents</a></li>
            </ul>
        </nav>

        <div class="nav-right">
            <a href="#" class="btn-Request-info">Request info</a>
            <a href="#" class="btn-login">Log in</a>
            <a href="#" class="btn-signup">Sign up for free</a>
        </div>
    </header>

    <main class="main-content">
        <h1 class="main-title">Images</h1>
        <h2 class="main-title">Try a style on an image</h2>

        <div class="gallery-container">
            <div class="image-item">
                <img src="images/dragon1.jpg" alt="Alive">
                <span class="image-caption">Alive</span>
            </div>

            <div class="image-item">
                <img src="images/lion.jpeg" alt="Dramatic">
                <span class="image-caption">Dramatic</span>
            </div>

            <div class="image-item">
                <img src="images/dragon2.jpeg" alt="Doodle">
                <span class="image-caption">Doodle</span>
            </div>

            <div class="image-item">
                <img src="images/girl.jpg" alt="Drow">
                <span class="image-caption">Drow</span>
            </div>
        </div>

        <div class="discover-section">
            <h2 class="discover-title">Discover something new</h2>
            
            <div class="discover-item">
                <img src="images/pearl.jpeg" alt="Pearl" class="discover-img">
                <span class="discover-text">Me as The Girl with a Pearl</span>
            </div>

            <div class="discover-item">
                <img src="images/burger.jpeg" alt="Burger" class="discover-img">
                <span class="discover-text">Create a professional product photo</span>
            </div>

            <div class="discover-item">
                <img src="images/remove.jpeg" alt="Remove" class="discover-img">
                <span class="discover-text">Remove people in the background</span>
            </div>

            <div class="discover-item">
                <img src="images/style.jpeg" alt="Style" class="discover-img">
                <span class="discover-text">Style me</span>
            </div>
        </div>

    </main>
</body>
</html>
